services:
  # 1. PostGIS Database (Spatial Analytics Database)
  db:
    image: postgis/postgis:15-3.3
    container_name: transitera_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transitera}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transitera}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API Server (FastAPI + Uber H3 + Gemini AI Proxy)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transitera_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-transitera}
      - MAPID_API_KEY=${MAPID_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend WebGIS (Next.js 16 + React 19 + MapLibre + Deck.gl)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transitera_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:3030"
    environment:
      - NEXT_PUBLIC_MAPID_API_KEY=${NEXT_PUBLIC_MAPID_API_KEY}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000/api}
      - PORT=3030
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
